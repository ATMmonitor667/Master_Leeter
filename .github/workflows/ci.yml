name: CI

on:
  push:
    branches: [main, production, 'codex/production-*', 'codex-production-*']
  pull_request:

jobs:
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: local-test-only
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: PostgreSQL migration, concurrency and privacy checks
        run: pnpm --filter @master-leeter/api test:database
        env:
          TEST_DATABASE_ADMIN_URL: postgresql://postgres:local-test-only@127.0.0.1:5432/postgres

  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secrets / env guard
        run: pnpm check:env

      # Before typecheck: a line-sorted file produces a wall of type errors that
      # bury the actual cause. Ask the cheap, unambiguous question first.
      - name: Corruption check
        run: pnpm check:sorted

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        run: pnpm test

      # The candidate-bot simulator is the gate that matters. Silence quality
      # regressions fail the build rather than getting noticed in a mock.
      - name: Simulation suite
        run: pnpm sim

      # M4-4. `pnpm sim` asserts individual behaviours; this asserts the
      # aggregate and prints the metric table, so a regression arrives as a
      # number with the offending step and the gate's own reason attached.
      - name: Interruption eval
        run: pnpm eval

      - name: Build
        run: pnpm build

      # Invariant 2, checked against the shipped artifact rather than intentions.
      - name: Bundle leak check
        run: pnpm check:bundle
