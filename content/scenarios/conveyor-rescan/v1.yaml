  type: ORIGINAL
  author: Rahat
  reviewNotes: >
    Authored from the first-repeated-element concept. Warehouse conveyor framing,
    identifier model, examples, and the windowed-stream follow-up are original to
    this product. No third-party problem statement was consulted or paraphrased.
  similarityCheck:
    performedAt: "2026-08-09T00:00:00.000Z"
    method: manual-review
